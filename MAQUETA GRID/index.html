<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maqueta Grid</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="layout-grid">
    
    <header class="panel header-area">
      <div class="header-left">
        <div class="wire-box-cross logo-box"></div>
        <div class="wire-lines">
          <span class="line full"></span>
          <span class="line half"></span>
        </div>
      </div>
      <h1 class="panel-title header-title">ENCABEZADO</h1>
      <div class="header-right">
        <div class="wire-search-bar"></div>
        <div class="wire-box-square"></div>
        <div class="wire-box-square"></div>
      </div>
    </header>

    <aside class="panel menu-area">
      <h2 class="panel-title">MENÚ</h2>
      <div class="user-row">
        <div class="circle-avatar"></div>
        <div class="wire-lines">
          <span class="line half"></span>
          <span class="line short"></span>
        </div>
      </div>
      <nav class="nav-list">
        <div class="nav-item active"><span class="icon">⌂</span> <span class="line fill"></span></div>
        <div class="nav-item"><span class="icon">⊞</span> <span class="line fill"></span></div>
        <div class="nav-item"><span class="icon">📊</span> <span class="line fill"></span></div>
        <div class="nav-item"><span class="icon">👤</span> <span class="line fill"></span></div>
        <div class="nav-item"><span class="icon">⚙</span> <span class="line fill"></span></div>
        <div class="nav-item"><span class="icon">?</span> <span class="line fill"></span></div>
        <div class="nav-item"><span class="icon">⮞</span> <span class="line fill"></span></div>
      </nav>
    </aside>

    <main class="panel main-area">
      <h2 class="panel-title">CONTENIDO PRINCIPAL</h2>
      
      <div class="wire-card top-banner">
        <div class="wire-box-cross img-slot"></div>
        <div class="wire-lines banner-text">
          <span class="line full"></span>
          <span class="line mid"></span>
        </div>
      </div>

      <div class="cards-row">
        <div class="wire-card product-card">
          <div class="wire-box-cross card-img"></div>
          <span class="line short"></span>
        </div>
        <div class="wire-card product-card">
          <div class="wire-box-cross card-img"></div>
          <span class="line short"></span>
        </div>
        <div class="wire-card product-card">
          <div class="wire-box-cross card-img"></div>
          <span class="line short"></span>
        </div>
      </div>

      <div class="wire-card text-block">
        <span class="line full"></span>
        <span class="line full"></span>
        <span class="line mid"></span>
      </div>
    </main>

    <section class="panel stats-area">
      <h2 class="panel-title">ESTADÍSTICAS</h2>
      <div class="charts-container">

        <div class="chart-bars">
          <div class="bar bar-1"></div>
          <div class="bar bar-2"></div>
          <div class="bar bar-3"></div>
          <div class="bar bar-4"></div>
        </div>

        <div class="chart-pie"></div>
      </div>
      <div class="stats-mini-cards">
        <div class="mini-box"><span class="line short"></span></div>
        <div class="mini-box"><span class="line short"></span></div>
        <div class="mini-box"><span class="line short"></span></div>
        <div class="mini-box"><span class="line short"></span></div>
      </div>
    </section>

    <section class="panel recent-area">
      <h2 class="panel-title">ACTIVIDAD RECIENTE</h2>
      <div class="activity-list">
        <div class="activity-item">
          <div class="circle-indicator"></div>
          <span class="line mid"></span>
          <span class="line-tag"></span>
        </div>
        <div class="activity-item">
          <div class="circle-indicator"></div>
          <span class="line mid"></span>
          <span class="line-tag"></span>
        </div>
        <div class="activity-item">
          <div class="circle-indicator"></div>
          <span class="line mid"></span>
          <span class="line-tag"></span>
        </div>
        <div class="activity-item">
          <div class="circle-indicator"></div>
          <span class="line mid"></span>
          <span class="line-tag"></span>
        </div>
        <div class="activity-item">
          <div class="circle-indicator"></div>
          <span class="line mid"></span>
          <span class="line-tag"></span>
        </div>
      </div>
    </section>

    <footer class="panel footer-area">
      <div class="footer-left">
        <span class="line full"></span>
        <span class="line half"></span>
      </div>
      <h2 class="panel-title footer-title">PIE DE PÁGINA</h2>
      <div class="footer-center-lines">
        <span class="line short"></span>
        <span class="line short"></span>
        <span class="line short"></span>
      </div>
      <div class="footer-right-boxes">
        <div class="wire-box-square mini"></div>
        <div class="wire-box-square mini"></div>
        <div class="wire-box-square mini"></div>
        <div class="wire-box-square mini"></div>
        </span></div>
      </div>
    </footer>

  </div>

</body>
</html>
